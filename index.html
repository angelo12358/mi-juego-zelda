// ================= AJUSTE DE PANTALLA =================
// Escala el canvas en numeros enteros para que el pixel art se vea nitido
function ajustar(){
  const marco = document.getElementById('marco');
  const aw = marco.clientWidth - 8, ah = marco.clientHeight - 8;
  let k = Math.max(1, Math.floor(Math.min(aw / c.width, ah / c.height)));
  // si no cabe entero (celular chico), usar escala fraccionaria
  if (c.width * k > aw || c.height * k > ah) k = Math.min(aw / c.width, ah / c.height);
  const w = (c.width * k) + 'px', h = (c.height * k) + 'px';
  [c, document.getElementById('g3d'), document.getElementById('pantalla')].forEach(el=>{ el.style.width = w; el.style.height = h; });
}
addEventListener('resize', ajustar);
addEventListener('orientationchange', () => setTimeout(ajustar, 150));
ajustar();

const PAL = {
  'K':'#1a1020','k':'#3a2a2a',
  'g':'#2f8f2f','G':'#58c04a','h':'#8be06a',
  's':'#f2c9a0','S':'#d9a073',
  'y':'#f5d84a','Y':'#c9a020',
  'b':'#3a5fd0','B':'#8fb0ff','n':'#1e2f7a',
  'r':'#d83a2a','R':'#ff7a5a','d':'#8f1f1a',
  'w':'#ffffff','e':'#cfe6f2','E':'#8fb0c8',
  'o':'#c8792a','O':'#8a4f1a',
  'p':'#b84a8a'
};
function crearSprite(filas, extra){
  const pal = extra ? {...PAL, ...extra} : PAL;
  const cv = document.createElement('canvas');
  cv.width = filas[0].length; cv.height = filas.length;
  const x = cv.getContext('2d');
  filas.forEach((f,j)=>[...f].forEach((ch,i)=>{
    if (pal[ch]) { x.fillStyle = pal[ch]; x.fillRect(i,j,1,1); }
  }));
  return cv;
}
function espejo(cv){
  const o = document.createElement('canvas'); o.width=cv.width; o.height=cv.height;
  const x = o.getContext('2d'); x.translate(cv.width,0); x.scale(-1,1); x.drawImage(cv,0,0); return o;
}

function rotar(cv, grados){
  const o = document.createElement('canvas');
  const sw = (grados===90||grados===270);
  o.width = sw?cv.height:cv.width; o.height = sw?cv.width:cv.height;
  const x = o.getContext('2d');
  x.translate(o.width/2,o.height/2); x.rotate(grados*Math.PI/180);
  x.drawImage(cv,-cv.width/2,-cv.height/2); return o;
}

// ================= TERRENO PROCEDURAL =================
function rnd(seed){ let s=seed; return ()=>{ s=(s*1664525+1013904223)%4294967296; return s/4294967296; }; }
const fondo = document.createElement('canvas'); fondo.width=c.width; fondo.height=c.height;
(function(){
  const x = fondo.getContext('2d'); const r = rnd(7);
  x.fillStyle='#4c9a3a'; x.fillRect(0,0,c.width,c.height);
  for (let i=0;i<900;i++){
    const px=Math.floor(r()*c.width), py=Math.floor(r()*c.height);
    x.fillStyle = r()<0.5 ? '#5aad45' : '#3f8530';
    x.fillRect(px,py,1,2);
  }
  for (let i=0;i<60;i++){
    const px=Math.floor(r()*c.width), py=Math.floor(r()*c.height);
    x.fillStyle='#a8e87a'; x.fillRect(px,py,1,1); x.fillRect(px-1,py+1,3,1);
  }
  for (let i=0;i<14;i++){
    const px=Math.floor(r()*(c.width-4)), py=Math.floor(r()*(c.height-4));
    x.fillStyle='#fff3a0'; x.fillRect(px+1,py,2,2);
    x.fillStyle='#f5c020'; x.fillRect(px+1,py+1,1,1);
  }
  // Camino de tierra hacia el pueblo (borde derecho)
  x.fillStyle='#8a6a3a'; x.fillRect(196,81,60,26);
  x.fillStyle='#c8a46a'; x.fillRect(198,82,58,24);

    x.fillRect(198+Math.floor(r()*56), 83+Math.floor(r()*22), 2, 1);

})();

function crearFondoPueblo(){
  const cv = document.createElement('canvas'); cv.width=c.width; cv.height=c.height;
  const x = cv.getContext('2d'); const r = rnd(21);
  x.fillStyle='#4c9a3a'; x.fillRect(0,0,c.width,c.height);
  for (let i=0;i<700;i++){
    x.fillStyle = r()<0.5 ? '#5aad45' : '#3f8530';
    x.fillRect(Math.floor(r()*c.width), Math.floor(r()*c.height), 1, 2);
  }
  // empedrado
  const empedrar = (rx,ry,rw,rh)=>{
    x.fillStyle='#7a6a52'; x.fillRect(rx,ry,rw,rh);
    for (let yy=ry; yy<ry+rh; yy+=4){
      const off = ((yy-ry)/4)%2 ? 3 : 0;
      for (let xx=rx-off; xx<rx+rw; xx+=6){
        const x0=Math.max(xx+1,rx), x1=Math.min(xx+6,rx+rw);
        if (x1<=x0) continue;
        x.fillStyle = r()<0.5 ? '#c2b296' : '#b0a084';
        x.fillRect(x0, yy+1, x1-x0, Math.min(3, ry+rh-yy-1));
      }
    }
  };
  empedrar(8,62,240,122);
  empedrar(0,78,8,36);
  empedrar(248,78,8,36);
  // jardin con flores
  x.fillStyle='#2f6f28'; x.fillRect(84,146,88,32);
  x.fillStyle='#4c9a3a'; x.fillRect(85,147,86,30);
  const flores = ['#ff7a9a','#fff3a0','#b8a0ff','#ffffff'];
  for (let i=0;i<22;i++){
    const px=87+Math.floor(r()*80), py=149+Math.floor(r()*25);
    x.fillStyle=flores[Math.floor(r()*flores.length)]; x.fillRect(px,py,2,2);
    x.fillStyle='#f5c020'; x.fillRect(px,py,1,1);
  }
  return cv;
}

// Montanas arriba, una cascada que baja a un rio, un puente de madera,
// y un camino de tierra que lleva a una cueva en la montana de la derecha.
function crearFondoRio(){
  const cv = document.createElement('canvas'); cv.width=c.width; cv.height=c.height;
  const x = cv.getContext('2d'); const r = rnd(33);
  x.fillStyle='#4c9a3a'; x.fillRect(0,0,c.width,c.height);
  for (let i=0;i<800;i++){
    x.fillStyle = r()<0.5 ? '#5aad45' : '#3f8530';
    x.fillRect(Math.floor(r()*c.width), Math.floor(r()*c.height), 1, 2);
  }
  for (let i=0;i<16;i++){
    const px=Math.floor(r()*250), py=40+Math.floor(r()*150);
    x.fillStyle='#fff3a0'; x.fillRect(px,py,2,2); x.fillStyle='#f5c020'; x.fillRect(px,py,1,1);
  }
  // camino de tierra
  const tierra = (rx,ry,rw,rh)=>{
    x.fillStyle='#c8a46a'; x.fillRect(rx,ry,rw,rh);
    for (let i=0;i<rw*rh/30;i++){
      x.fillStyle = r()<0.5 ? '#b08850' : '#dcbc80';
      x.fillRect(rx+Math.floor(r()*(rw-2)), ry+Math.floor(r()*rh), 2, 1);
    }
  };
  tierra(0,88,124,22); tierra(148,88,60,22); tierra(196,96,24,22); tierra(206,104,24,22); tierra(214,106,42,26);
  // orillas y fondo del rio
  x.fillStyle='#7a6a52'; x.fillRect(116,30,40,162);
  x.fillStyle='#2a78b0'; x.fillRect(120,30,32,162);
  return cv;
}

// ================= ENTRADA: TECLADO =================

addEventListener('keydown', e => { keys[e.key.toLowerCase()] = true; if ([' ','arrowup','arrowdown','arrowleft','arrowright'].includes(e.key.toLowerCase())) e.preventDefault(); });
addEventListener('keyup',   e => { keys[e.key.toLowerCase()] = false; });

// ================= ENTRADA: TACTIL =================
// Cada boton usa pointer events, asi funcionan varios dedos a la vez
// (por ejemplo moverte con el pulgar izquierdo y atacar con el derecho)
document.querySelectorAll('.btn').forEach(b => {
  const k = b.dataset.k;
  const activar = e => { e.preventDefault(); keys[k] = true;  b.classList.add('on'); b.setPointerCapture && b.setPointerCapture(e.pointerId); };
  const soltar  = e => { e.preventDefault(); keys[k] = false; b.classList.remove('on'); };
  b.addEventListener('pointerdown', activar);
  b.addEventListener('pointerup', soltar);
  b.addEventListener('pointercancel', soltar);
  b.addEventListener('lostpointercapture', soltar);
  b.addEventListener('contextmenu', e => e.preventDefault());
});
// Tocar la pantalla cuando termina el juego reinicia
c.addEventListener('pointerdown', () => { if (fin) location.reload(); });

let escena = 'campo';   // 'campo' o 'pueblo'
function choca(x,y,w,h,ignorar){
  if (x<0||y<0||x+w>c.width||y+h>c.height) return true;
  const lista = escena==='pueblo' ? pueblo.solidos : escena==='rio' ? rio.solidos : solidos;
  return lista.some(s => s!==ignorar && x < s.x+s.ox+s.w && x+w > s.x+s.ox && y < s.y+s.oy+s.h && y+h > s.y+s.oy);
}
function solapa(a,b){ return a.x<b.x+b.w && a.x+a.w>b.x && a.y<b.y+b.h && a.y+a.h>b.y; }

// ================= ENEMIGOS =================
const DIRS = [[0,-1,'arriba'],[0,1,'abajo'],[-1,0,'izq'],[1,0,'der']];
const enemigos=[], balas=[], drops=[], particulas=[];
for (let i=0;i<5;i++){
  let ex,ey,n=0;
  do { ex=rand(1,COLS-2)*T; ey=rand(1,ROWS-2)*T; n++; } while ((choca(ex,ey,12,12) || Math.hypot(ex-p.x,ey-p.y)<70) && n<200);
  enemigos.push({x:ex,y:ey,w:12,h:12,vida:2,dir:rand(0,3),t:rand(30,90),disp:rand(80,200),golpe:0});
}

// ================= ESPADA: TAJO Y REMOLINO =================
// Toque de Espacio = tajo en arco. Mantener = cargar (la espada brilla).
// Soltar con la carga llena = remolino: una vuelta completa que golpea todo alrededor.
const T_TAJO = 14, T_GIRO = 22, T_CARGA = 45, LARGO_ESPADA = 19;
const ANG_DIR = {der:0, abajo:Math.PI/2, izq:Math.PI, arriba:-Math.PI/2};
// angulo de la espada en el plano del juego (x a la derecha, y hacia abajo)
function anguloEspada(){
  const base = ANG_DIR[p.dir];
  if (p.giro>0) return base + (1 - p.giro/T_GIRO) * Math.PI*2;
  if (p.atacando>0) return base - 1.4 + (1 - p.atacando/T_TAJO) * 2.8;
  return base;   // cargando: espada al frente
}
function golpear(en, dano, dx, dy, aturdido){
  en.vida -= dano; en.golpe = aturdido; chispas(en.x+6,en.y+6,'#ffffff');
  const nx = en.x+dx*10, ny = en.y+dy*10;
  if (!choca(nx,en.y,en.w,en.h)) en.x = nx;
  if (!choca(en.x,ny,en.w,en.h)) en.y = ny;
}
function revisarGolpes(){
  if (escena!=='campo') return;
  const cx = p.x+p.w/2, cy = p.y+p.h/2;
  if (p.giro>0){
    enemigos.forEach(en=>{
      if (en.golpe>0) return;
      const ex = en.x+6-cx, ey = en.y+6-cy, d = Math.hypot(ex,ey) || 1;
      if (d < LARGO_ESPADA+8) golpear(en, 2, ex/d, ey/d, T_GIRO+4);
    });
  } else if (p.atacando>0){
    const a = anguloEspada(), base = ANG_DIR[p.dir];
    const zonas = [9, LARGO_ESPADA].map(r=>({x:cx+Math.cos(a)*r-4, y:cy+Math.sin(a)*r-4, w:8, h:8}));
    enemigos.forEach(en=>{ if (en.golpe<=0 && zonas.some(z=>solapa(z,en))) golpear(en, 1, Math.cos(base), Math.sin(base), 20); });
  }
}
function chispas(x,y,col){ for(let i=0;i<8;i++) particulas.push({x,y,dx:(Math.random()-.5)*2,dy:(Math.random()-.5)*2,vida:20,col}); }

let fin = false;
function dano(){ p.vida--; p.inv=70; chispas(p.x+5,p.y+5,'#ff5050'); if (p.vida<=0) fin='perdiste'; }

// ================= ESCENAS, ALDEANOS Y DIALOGOS =================
let dialogo = null, cartel = null, fundido = 0;
let espAntes = false, esperarSoltar = false;
const CAMINO_Y1 = 72, CAMINO_Y2 = 116;   // franja del camino entre campo y pueblo

function enCamino(){ return p.y >= CAMINO_Y1 && p.y + p.h <= CAMINO_Y2; }
const MAPA = { campo:{der:'pueblo'}, pueblo:{izq:'campo', der:'rio'}, rio:{izq:'pueblo'} };
const NOMBRES = { pueblo:'Lagos', rio:'La Cascada' };
// lado = por donde aparece el jugador en el nuevo escenario
function entrar(dest, lado='izq'){
  escena = dest; balas.length = 0; particulas.length = 0; fundido = 14; p.atacando = 0; p.carga = -1; p.giro = 0;
  p.y = Math.min(Math.max(p.y, CAMINO_Y1+2), CAMINO_Y2-p.h-2);
  p.x = lado==='izq' ? 3 : c.width - p.w - 3;
  cartel = NOMBRES[dest] ? {texto:NOMBRES[dest], t:150} : null;
}
function revisarSalida(dx){
  if (!enCamino()) return;
  const salidas = MAPA[escena];
  if (dx>0 && p.x+p.w >= c.width-2 && salidas.der) entrar(salidas.der, 'izq');
  else if (dx<0 && p.x <= 2 && salidas.izq) entrar(salidas.izq, 'der');
}
function npcCercano(){
  let mejor=null, dMin=20;
  pueblo.npcs.forEach(n=>{ const d=Math.hypot(n.x-p.x, n.y-p.y); if (d<dMin){ dMin=d; mejor=n; } });
  return mejor;
}
function hablar(n){
  const lineas = typeof n.frases==='function' ? n.frases() : n.frases;
  dialogo = {nombre:n.nombre, lineas, i:0};
}
function actualizarNPCs(){
  pueblo.npcs.forEach(n=>{
    if (!n.anda) return;
    n.t--;
    if (n.t<=0){ n.dir = Math.random()<0.4 ? -1 : rand(0,3); n.t = rand(40,110); }
    if (n.dir<0) return;
    const d = DIRS[n.dir], nx = n.x+d[0]*n.vel, ny = n.y+d[1]*n.vel;
    if (Math.hypot(nx-n.cx, ny-n.cy) > n.radio || choca(nx,ny,n.w,n.h,n) || solapa({x:nx,y:ny,w:n.w,h:n.h}, p)) n.t = 0;
    else { n.x = nx; n.y = ny; n.paso += 0.12; }
  });
}
function actualizarParticulas(){
  for (let i=particulas.length-1;i>=0;i--){
    const q=particulas[i]; q.x+=q.dx; q.y+=q.dy; q.vida--; if(q.vida<=0) particulas.splice(i,1);
  }
}

// ================= ACTUALIZAR =================
function actualizar(){
  if (fin){ if (keys['enter']) location.reload(); return; }

  // Espacio "recien presionado" (para hablar y pasar dialogos)
  const espNuevo = !!keys[' '] && !espAntes;
  espAntes = !!keys[' '];
  if (!keys[' ']) esperarSoltar = false;
  if (fundido>0) fundido--;
  if (cartel && --cartel.t<=0) cartel = null;
  actualizarParticulas();

  if (dialogo){
    if (espNuevo && ++dialogo.i >= dialogo.lineas.length){ dialogo = null; esperarSoltar = true; }
    return;
  }

  let dx=0, dy=0;
  const dirAntes = p.dir;
  if (keys['arrowleft'] ||keys['a']) { dx=-1; p.dir='izq'; }
  if (keys['arrowright']||keys['d']) { dx=1;  p.dir='der'; }
  if (keys['arrowup']   ||keys['w']) { dy=-1; p.dir='arriba'; }
  if (keys['arrowdown'] ||keys['s']) { dy=1;  p.dir='abajo'; }
  if (dx&&dy){ dx*=0.7; dy*=0.7; }
  if (p.carga>=0 || p.giro>0) p.dir = dirAntes;   // cargando o girando: mira siempre al mismo lado
  let v = p.vel;
  const corre = keys['shift'] && p.est>0 && (dx||dy);
  if (corre){ v*=1.7; p.est-=1.2; } else p.est=Math.min(100,p.est+0.6);
  if (p.atacando>0 || p.giro>0) v*=0.3; else if (p.carga>=0) v*=0.55;
  if (!choca(p.x+dx*v,p.y,p.w,p.h)) p.x+=dx*v;
  if (!choca(p.x,p.y+dy*v,p.w,p.h)) p.y+=dy*v;
  if (dx||dy) p.paso+=corre?0.3:0.18;
  revisarSalida(dx);
  if (escena==='rio' && solapa(p, rio.cueva)){
    p.y = rio.cueva.y + rio.cueva.h + 3;
    dialogo = {nombre:'Cueva', lineas:['La cueva está muy oscura... no se ve nada.',
                                       'Necesitarás una antorcha para entrar. (Próximamente)'], i:0};
    return;
  }

  if (escena==='pueblo'){
    actualizarNPCs();
    if (espNuevo){ const n = npcCercano(); if (n){ hablar(n); return; } }
  }

  if (espNuevo && !esperarSoltar && p.atacando===0 && p.giro===0 && p.est>=10){
    p.atacando = T_TAJO; p.est -= 10; p.carga = 0;
  }
  if (p.atacando>0) p.atacando--;
  else if (p.giro>0) p.giro--;
  else if (p.carga>=0){
    if (keys[' ']){
      if (p.carga < T_CARGA && ++p.carga===T_CARGA) chispas(p.x+5,p.y+5,'#bfe6ff');   // carga lista
    } else {
      if (p.carga>=T_CARGA && p.est>=15){ p.giro = T_GIRO; p.est -= 15; }
      p.carga = -1;
    }
  }
  revisarGolpes();
  if (p.inv>0) p.inv--;
  if (escena!=='campo') return;   // en el pueblo no hay enemigos

  for (let i=enemigos.length-1;i>=0;i--){
    const en = enemigos[i];
    if (en.golpe>0) en.golpe--;
    if (en.vida<=0){
      chispas(en.x+6,en.y+6,'#ffd84a');
      drops.push({x:en.x+2,y:en.y+2,tipo:Math.random()<0.35?'corazon':'rupia'});
      enemigos.splice(i,1); continue;
    }
    en.t--; en.disp--;
    if (en.t<=0){ en.dir=rand(0,3); en.t=rand(30,90); }
    const d = DIRS[en.dir];
    const nx=en.x+d[0]*0.4, ny=en.y+d[1]*0.4;
    if (!choca(nx,ny,en.w,en.h)){ en.x=nx; en.y=ny; } else en.t=0;
    if (en.disp<=0){
      en.disp=rand(100,220);
      balas.push({x:en.x+4,y:en.y+4,w:4,h:4,dx:d[0]*1.6,dy:d[1]*1.6});
    }
    if (p.inv===0 && solapa(p,en)) dano();
  }

  for (let i=balas.length-1;i>=0;i--){
    const b=balas[i]; b.x+=b.dx; b.y+=b.dy;
    if (choca(b.x,b.y,b.w,b.h)){ balas.splice(i,1); continue; }
    if (p.inv===0 && solapa(p,b)){ dano(); balas.splice(i,1); }
  }

  for (let i=drops.length-1;i>=0;i--){
    if (solapa(p,{x:drops[i].x,y:drops[i].y,w:10,h:10})){
      if (drops[i].tipo==='corazon') p.vida=Math.min(p.vidaMax,p.vida+1); else p.rupias++;
      drops.splice(i,1);
    }
  }
  if (enemigos.length===0) fin='ganaste';
}

// ================= MUNDO 3D (Three.js) =================
// La logica del juego sigue en "pixeles" (256x192). Aqui solo se dibuja en 3D:
// 16 pixeles del juego = 1 unidad 3D. El suelo es el mismo dibujo 2D de siempre.
const U = 1/16;
const wx = x => x*U - 8;     // x del juego -> X en 3D
const wz = y => y*U - 6;     // y del juego -> Z en 3D (profundidad)
const ESC = 1.2;             // tamano de los personajes

const g3d = document.getElementById('g3d');
const renderer = new THREE.WebGLRenderer({canvas:g3d, antialias:false});
renderer.setPixelRatio(1);
renderer.setSize(c.width*3, c.height*3, false);
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;

const escena3d = new THREE.Scene();
escena3d.background = new THREE.Color('#9fd8f5');
escena3d.fog = new THREE.Fog('#9fd8f5', 24, 42);

const camara = new THREE.PerspectiveCamera(36, c.width/c.height, 0.1, 100);
const CAM = {y:14, z:15.5, mira:0.4};

escena3d.add(new THREE.HemisphereLight('#e8f6ff', '#55803f', 0.8));
const sol = new THREE.DirectionalLight('#fff2d8', 0.8);
sol.position.set(-6, 14, 7); sol.castShadow = true;
sol.shadow.mapSize.set(1024, 1024);
Object.assign(sol.shadow.camera, {left:-13, right:13, top:12, bottom:-12, near:1, far:45});
sol.shadow.camera.updateProjectionMatrix();
sol.shadow.bias = -0.0015;
escena3d.add(sol);

// ---------- utilidades ----------
const mats = {};
function mat(col){ return mats[col] || (mats[col] = new THREE.MeshStandardMaterial({color:col, flatShading:true, roughness:1, metalness:0})); }
function malla(geo, col, x, y, z){
  const m = new THREE.Mesh(geo, typeof col==='string' ? mat(col) : col);
  m.position.set(x,y,z); m.castShadow = true; m.receiveShadow = true; return m;
}
const texCache = new Map();
function texCanvas(cv){
  if (texCache.has(cv)) return texCache.get(cv);
  const t = new THREE.CanvasTexture(cv);
  t.magFilter = t.minFilter = THREE.NearestFilter; t.generateMipmaps = false;
  texCache.set(cv, t); return t;
}
function sprite(cv, escala=ESC){
  const s = new THREE.Sprite(new THREE.SpriteMaterial({map:texCanvas(cv), alphaTest:0.5, fog:false}));
  s.center.set(0.5, 0); s.scale.set(cv.width*U*escala, cv.height*U*escala, 1); return s;
}
const geoSombra = new THREE.CircleGeometry(0.34, 14).rotateX(-Math.PI/2);
const matSombra = new THREE.MeshBasicMaterial({color:'#000', transparent:true, opacity:0.28, depthWrite:false});
function sombra3d(r=1){ const m = new THREE.Mesh(geoSombra, matSombra); m.scale.setScalar(r); m.position.y = 0.02; return m; }
// personaje = sprite pixel art de pie + sombrita redonda en el suelo
function personaje(cv, escala){
  const g = new THREE.Group(); g.userData.spr = sprite(cv, escala);
  g.add(sombra3d(), g.userData.spr); return g;
}
function texTexto(texto, fondoCol, letraCol, w=160, h=36){
  const cv = document.createElement('canvas'); cv.width=w; cv.height=h;
  const x = cv.getContext('2d');
  x.fillStyle=fondoCol; x.fillRect(0,0,w,h);
  x.font='bold '+Math.floor(h*0.62)+'px monospace'; x.textAlign='center'; x.textBaseline='middle';
  x.fillStyle=letraCol; x.fillText(texto, w/2, h/2+1, w-10);
  return new THREE.CanvasTexture(cv);
}
// tabla de madera con texto al frente
function tabla(texto, ancho, alto, fondoCol, letraCol){
  const g = new THREE.Group();
  g.add(malla(new THREE.BoxGeometry(ancho+0.1, alto+0.1, 0.08), '#3a1f0a', 0, 0, 0));
  const frente = new THREE.Mesh(new THREE.PlaneGeometry(ancho, alto),
    new THREE.MeshStandardMaterial({map:texTexto(texto, fondoCol, letraCol, Math.round(ancho*90), Math.round(alto*90)), roughness:1}));
  frente.position.z = 0.045; g.add(frente); return g;
}
function prisma(largo, prof, alto){   // techo de dos aguas
  const s = new THREE.Shape(); s.moveTo(-prof/2,0); s.lineTo(prof/2,0); s.lineTo(0,alto); s.lineTo(-prof/2,0);
  const geo = new THREE.ExtrudeGeometry(s, {depth:largo, bevelEnabled:false});
  geo.translate(0,0,-largo/2); geo.rotateY(Math.PI/2); return geo;
}

// ---------- piezas del escenario ----------
function arbol3d(x, z, esc=1){
  const g = new THREE.Group();
  g.add(malla(new THREE.CylinderGeometry(0.13,0.19,0.75,6), '#8a4f1a', 0,0.37,0));
  g.add(malla(new THREE.IcosahedronGeometry(0.85,0), '#2f8f38', 0,1.15,0));
  g.add(malla(new THREE.IcosahedronGeometry(0.6,0), '#4cc050', -0.15,1.65,0.1));
  g.position.set(x,0,z); g.scale.setScalar(esc); g.rotation.y = Math.random()*6; return g;
}
function arbusto3d(x, z){
  const m = malla(new THREE.IcosahedronGeometry(0.46,0), '#3a9a3e', x,0.3,z);
  m.scale.set(1,0.75,1); m.rotation.y = Math.random()*6; return m;
}
function roca3d(x, z){
  const m = malla(new THREE.DodecahedronGeometry(0.42,0), '#8a8a92', x,0.24,z);
  m.scale.set(1,0.7,0.9); m.rotation.set(Math.random(), Math.random()*6, 0); return m;
}
function letrero3d(texto, x, z){
  const g = new THREE.Group();
  g.add(malla(new THREE.CylinderGeometry(0.06,0.07,1.0,6), '#8a4f1a', 0,0.5,0));
  const t = tabla(texto, 1.5, 0.45, '#c8792a', '#3a1f0a'); t.position.y = 0.95; g.add(t);
  g.position.set(x,0,z); return g;
}
function casa3d(o){
  const g = new THREE.Group();
  const ancho = o.w*U, prof = o.h*U, alto = o.panaderia ? 1.35 : 1.2, fz = prof/2 + 0.03;
  g.position.set(wx(o.x+o.ox+o.w/2), 0, wz(o.y+o.oy+o.h/2));
  g.add(malla(new THREE.BoxGeometry(ancho, alto, prof), o.panaderia ? '#f0d8a8' : '#e8d8b0', 0,alto/2,0));
  // vigas en las esquinas
  [-1,1].forEach(l=>g.add(malla(new THREE.BoxGeometry(0.12,alto,0.12), '#8a4f1a', l*(ancho/2-0.04),alto/2,prof/2-0.04)));
  g.add(malla(prisma(ancho+0.3, prof+0.35, o.panaderia ? 0.85 : 0.95), o.techo, 0,alto,0));
  // puerta y ventanas
  g.add(malla(new THREE.BoxGeometry(0.62,0.85,0.06), '#8a4f1a', 0,0.425,fz));
  g.add(malla(new THREE.BoxGeometry(0.06,0.06,0.03), '#f5d84a', 0.2,0.42,fz+0.04));
  const vidrio = o.panaderia ? '#ffe8a0' : '#8fd0f0';
  [-1,1].forEach(l=>{
    g.add(malla(new THREE.BoxGeometry(0.5,0.45,0.05), '#5a3210', l*ancho*0.31,o.panaderia?0.5:0.72,fz));
    g.add(malla(new THREE.BoxGeometry(0.4,0.35,0.06), vidrio, l*ancho*0.31,o.panaderia?0.5:0.72,fz+0.01));
  });
  if (o.cura){   // corazon sobre la puerta del curandero
    const t = tabla('', 0.7, 0.55, '#c8792a', '#c8792a');
    const h = new THREE.Mesh(new THREE.PlaneGeometry(0.5,0.42), new THREE.MeshBasicMaterial({map:texCanvas(SPR_CORAZON), alphaTest:0.5}));
    h.position.z = 0.05; t.add(h);
    t.position.set(0, alto+0.55, fz+0.25); t.rotation.x = -0.55; g.add(t);
  }
  if (o.panaderia){
    // letrero grande sobre la fachada, inclinado hacia la camara para que se lea
    const t = tabla('El Molinito', ancho*0.95, 0.5, '#5a3210', '#ffe8a0');
    t.position.set(0, alto+0.5, fz+0.3); t.rotation.x = -0.55; g.add(t);
    [-1,1].forEach(l=>g.add(malla(new THREE.BoxGeometry(0.06,0.6,0.06), '#3a1f0a', l*ancho*0.4, alto+0.15, fz+0.2)));
    // toldo a rayas rojas y blancas
    const cv = document.createElement('canvas'); cv.width=14; cv.height=1;
    const x = cv.getContext('2d'); for (let i=0;i<14;i++){ x.fillStyle = i%2 ? '#ffffff' : '#d83a2a'; x.fillRect(i,0,1,1); }
    const toldo = malla(new THREE.BoxGeometry(ancho, 0.04, 0.5),
      new THREE.MeshStandardMaterial({map:texCanvas(cv), roughness:1}), 0,0.98,fz+0.2);
    toldo.rotation.x = 0.4; g.add(toldo);
    // chimenea con humo
    g.add(malla(new THREE.BoxGeometry(0.3,0.7,0.3), '#a04a3a', ancho*0.3,alto+0.55,-0.25));
    o.humo3d = [0,1,2].map(i=>{
      const m = new THREE.Mesh(new THREE.BoxGeometry(0.16,0.16,0.16), new THREE.MeshBasicMaterial({color:'#eef0f5', transparent:true}));
      g.add(m); return m;
    });
    o.chimenea = new THREE.Vector3(ancho*0.3, alto+0.95, -0.25);
  }
  return g;
}
function fuente3d(fu){
  const g = new THREE.Group();
  g.position.set(wx(fu.x+fu.ox+fu.w/2), 0, wz(fu.y+fu.oy+fu.h/2));
  g.add(malla(new THREE.CylinderGeometry(0.95,1.02,0.38,12), '#9a9aa6', 0,0.19,0));
  const agua = new THREE.MeshStandardMaterial({color:'#3a8fd0', emissive:'#12406a', roughness:0.3, flatShading:true});
  g.add(malla(new THREE.CylinderGeometry(0.8,0.8,0.05,12), agua, 0,0.36,0));
  g.add(malla(new THREE.CylinderGeometry(0.11,0.15,0.95,6), '#b8b8c2', 0,0.6,0));

// arboles alrededor del borde para que el mundo no termine "en el aire".
// "hueco" deja libre el camino entre el campo y el pueblo.
function bordeArboles(grupo, huecos, semilla, conArriba=true, conDerecha=true, rioX=null){
  const r = rnd(semilla);
  const libre = (x,z)=> huecos.some(h=>Math.abs(x - h.x) < 1.6) && z > wz(CAMINO_Y1)-0.6 && z < wz(CAMINO_Y2)+0.6;
  if (conArriba) for (let x=-10.5; x<=10.5; x+=1.3) grupo.add(arbol3d(x + r()*0.4, -7.1 - r()*0.8, 0.95 + r()*0.3));
  for (let z=-6.5; z<=7.5; z+=1.3){
    [-9.1, 9.1].forEach(x=>{
      if (x>0 && !conDerecha) return;
      if (!libre(x,z)) grupo.add(arbol3d(x + (x<0?-1:1)*r()*0.5, z + r()*0.3, 0.9 + r()*0.3));
    });
  }
  for (let x=-8; x<=8; x+=1.1){
    if (rioX!==null && Math.abs(x - rioX) < 1.4) continue;   // no poner arbustos dentro del rio
    grupo.add(arbusto3d(x + r()*0.3, 6.6 + r()*0.3));
  }
}

// montana de roca hecha de columnas de distinta altura, con pasto arriba
function montana3d(grupo, rx, ry, rw, rh, alto, semilla, fijoX, sinGrietasX){
  const r = rnd(semilla);
  for (let x0=rx; x0<rx+rw; x0+=16){
    const ancho = Math.min(16, rx+rw-x0)*U, prof = rh*U;
    const fijo = fijoX && x0+16 > fijoX[0] && x0 < fijoX[1];
    const h = fijo ? alto : alto + r()*0.9 - 0.3;
    const cx = wx(x0)+ancho/2, cz = wz(ry)+prof/2;
    grupo.add(malla(new THREE.BoxGeometry(ancho+0.02, h, prof), r()<0.5 ? '#8a6a52' : '#9a7a5e', cx, h/2, cz));
    grupo.add(malla(new THREE.BoxGeometry(ancho+0.06, 0.14, prof+0.06), '#5aad45', cx, h+0.05, cz));
    const grieta = r()<0.5, gx = cx+(r()-0.5)*0.6;
    const tapaCueva = sinGrietasX && wx(sinGrietasX[0]) < gx+0.1 && gx-0.1 < wx(sinGrietasX[1]);
    if (grieta && !tapaCueva) grupo.add(malla(new THREE.BoxGeometry(0.08, h*0.6, 0.05), '#6a4e3a', gx, h*0.45, cz+prof/2+0.02));
    if (r()<0.6) grupo.add(malla(new THREE.DodecahedronGeometry(0.22+r()*0.2,0), '#7a5e48', cx+(r()-0.5)*0.7, 0.15, cz+prof/2+0.1));
  }
}
// textura de agua con rayitas, que se mueve para simular corriente
function texAgua(base, rayas){
  const cv = document.createElement('canvas'); cv.width=16; cv.height=64;
  const x = cv.getContext('2d'); const r = rnd(4);
  x.fillStyle=base; x.fillRect(0,0,16,64);
  for (let i=0;i<26;i++){ x.fillStyle=rayas; x.fillRect(Math.floor(r()*15), Math.floor(r()*60), 1, 2+Math.floor(r()*5)); }
  const t = new THREE.CanvasTexture(cv);
  t.wrapS = t.wrapT = THREE.RepeatWrapping; t.magFilter = t.minFilter = THREE.NearestFilter; t.generateMipmaps = false;
  return t;
}

// crea/actualiza/borra los objetos 3D para que sigan a las listas del juego
function sincronizar(lista, mapa, crear, actualizar, padre){
  const vistos = new Set();
  lista.forEach(o=>{
    let obj = mapa.get(o);
    if (!obj){ obj = crear(o); mapa.set(o, obj); padre.add(obj); }
    actualizar(o, obj); vistos.add(o);
  });
  mapa.forEach((obj, o)=>{
    if (vistos.has(o)) return;
    padre.remove(obj); mapa.delete(o);
    obj.traverse(m=>{ if (m.material && m.material!==matSombra && !Object.values(mats).includes(m.material)) m.material.dispose(); });
  });
}

function actualizar3d(){
  const t = Date.now();
  grupoCampo.visible = escena==='campo';
  grupoPueblo.visible = escena==='pueblo';
  grupoRio.visible = escena==='rio';

  // jugador
  const lx = wx(p.x+5), lz = wz(p.y+10);
  const ls = linkObj.userData.spr;
  ls.material.map = texCanvas(SPR_LINK[p.dir]);
  ls.position.y = (Math.floor(p.paso)%2===1) ? 0.06 : 0;
  const piso = alturaPiso(p.x+5, p.y+8);
  linkObj.position.set(lx, piso, lz);
  linkObj.visible = !(p.inv>0 && Math.floor(p.inv/4)%2);
  const cargando = p.carga>=0 && p.atacando===0 && p.giro===0;
  espada3d.visible = p.atacando>0 || p.giro>0 || cargando;
  estela.visible = p.atacando>0 || p.giro>0;
  if (espada3d.visible){
    const a = anguloEspada(), yE = piso + 0.42, zc = wz(p.y+p.h/2);
    espada3d.position.set(lx, yE, zc);
    espada3d.rotation.set(0, -a, 0);
    // brillo: sube mientras carga, parpadea azul cuando esta lista y durante el remolino
    let brillo = 0;
    if (cargando) brillo = p.carga>=T_CARGA ? (Math.floor(t/90)%2 ? 1 : 0.5) : p.carga/T_CARGA*0.35;
    if (p.giro>0) brillo = 1;
    matHoja.emissive.setRGB(0.25*brillo, 0.6*brillo, 1.0*brillo);
    if (estela.visible){
      const inicio = p.giro>0 ? ANG_DIR[p.dir] : ANG_DIR[p.dir]-1.4;
      const barrido = Math.max(0.05, a - inicio);
      estela.geometry.dispose();
      estela.geometry = new THREE.RingGeometry(0.3, 1.35, 24, 1, -a, barrido).rotateX(-Math.PI/2);
      estela.position.set(lx, yE, zc);
      estela.material.color.set(p.giro>0 ? '#8fd8ff' : '#ffffff');
      estela.material.opacity = p.giro>0 ? 0.75 : 0.6;
    }
  }

  // camara: fija sobre la pantalla, con un pequeno seguimiento al jugador
  const cx = lx*0.3, cz = lz*0.06;
  camara.position.set(cx, CAM.y, CAM.z + cz);
  camara.lookAt(cx, 0, CAM.mira + cz);

  if (escena==='campo'){
    sincronizar(enemigos, mapEnemigos, ()=>personaje(SPR_OCTO), (en,obj)=>{
      obj.position.set(wx(en.x+6), 0, wz(en.y+12));
      obj.userData.spr.material.opacity = (en.golpe>0 && Math.floor(en.golpe/3)%2) ? 0.35 : 1;
      obj.userData.spr.material.transparent = en.golpe>0;
    }, grupoCampo);
    sincronizar(drops, mapDrops, d=>{
      const s = sprite(d.tipo==='corazon' ? SPR_CORAZON : SPR_RUPIA, 1); s.center.set(0.5,0.5); return s;
    }, (d,s)=>s.position.set(wx(d.x+5), 0.35+Math.sin(t/150+d.x)*0.08, wz(d.y+8)), grupoCampo);
    sincronizar(balas, mapBalas, ()=>malla(geoBala, '#c8792a', 0,0,0),
      (b,m)=>m.position.set(wx(b.x+2), 0.4, wz(b.y+4)), grupoCampo);
  } else if (escena==='rio'){
    texCascada.offset.y = (t/900) % 1;
    texRio.offset.y = (t/2600) % 1;
    espuma.forEach((m,i)=>{ const k = Math.sin(t/180 + i*1.7); m.scale.setScalar(0.8 + k*0.3); m.position.y = 0.12 + k*0.05; });
  } else {
    pueblo.npcs.forEach(n=>{
      n.obj.position.set(wx(n.x+5), 0, wz(n.y+10));
      n.obj.userData.spr.position.y = (Math.floor(n.paso)%2===1) ? 0.06 : 0;
    });
    const n = !dialogo && npcCercano();
    burbuja.visible = !!n;
    if (n) burbuja.position.set(wx(n.x+5), 1.45 + Math.sin(t/200)*0.06, wz(n.y+10));
    const fu = pueblo.fuente;
    fu.gotas.forEach((m,i)=>{
      const k = ((t/700) + i/fu.gotas.length) % 1, ang = i*Math.PI/3;
      m.position.set(Math.cos(ang)*(0.3+k*0.4), 1.2 + k*0.2 - k*k*1.1, Math.sin(ang)*(0.3+k*0.4));
    });
    pueblo.casas.forEach(o=>{
      if (!o.humo3d) return;
      o.humo3d.forEach((m,i)=>{
        const k = ((t/1800) + i/3) % 1;
        m.position.set(o.chimenea.x + Math.sin(k*6+i)*0.12, o.chimenea.y + k*1.1, o.chimenea.z);
        m.scale.setScalar(0.6 + k*1.2); m.material.opacity = 1-k;
      });
    });
  }

  // chispas
  sincronizar(particulas, mapParticulas, q=>{
    const s = new THREE.Sprite(new THREE.SpriteMaterial({color:q.col, transparent:true, fog:false}));
    s.scale.set(0.14,0.14,1); return s;
  }, (q,s)=>{ s.position.set(wx(q.x), 0.5 + (20-q.vida)*0.02, wz(q.y)); s.material.opacity = q.vida/20; }, escena3d);
}

function partirTexto(txt, ancho){
  const palabras = txt.split(' '), lineas = []; let actual = '';
  palabras.forEach(w=>{
    const prueba = actual ? actual+' '+w : w;
    if (ctx.measureText(prueba).width > ancho && actual){ lineas.push(actual); actual = w; }
    else actual = prueba;
  });
  if (actual) lineas.push(actual);
  return lineas;
}

  ctx.fillStyle='rgba(10,8,20,.85)'; ctx.fillRect(c.width/2-w/2, 30, w, 16);
  ctx.strokeStyle='#f5d84a'; ctx.strokeRect(c.width/2-w/2+.5, 30.5, w-1, 15);
  ctx.fillStyle='#fff'; ctx.fillText(cartel.texto, c.width/2, 41);
  ctx.textAlign='left'; ctx.globalAlpha=1;
}

function dibujar(){
  actualizar3d();
  renderer.render(escena3d, camara);

  ctx.clearRect(0,0,c.width,c.height);
  dibujarHUD();
  if (cartel) dibujarCartel();
  if (dialogo) dibujarDialogo();
  if (fundido>0){ ctx.fillStyle='rgba(0,0,0,'+(fundido/14)+')'; ctx.fillRect(0,0,c.width,c.height); }

  if (fin){
    ctx.fillStyle='rgba(10,8,20,.75)'; ctx.fillRect(0,0,c.width,c.height);
    ctx.fillStyle='#fff'; ctx.textAlign='center';
    ctx.font='bold 16px monospace';
    ctx.fillText(fin==='ganaste'?'¡Ganaste!':'Game Over', c.width/2, c.height/2-4);
    ctx.font='8px monospace'; ctx.fillText('Enter o toca la pantalla para reiniciar', c.width/2, c.height/2+14);
    ctx.textAlign='left';
  }
}

function loop(){ actualizar(); dibujar(); requestAnimationFrame(loop); }
loop();
</script>
</body>
</html>
