<style>
  * { -webkit-tap-highlight-color: transparent; -webkit-user-select:none; user-select:none; touch-action:none; }
  html, body { margin:0; height:100%; background:#14161c; overflow:hidden; font-family:monospace; color:#fff; }
  body { display:flex; flex-direction:column; align-items:center; justify-content:center; }
  #marco { position:relative; display:flex; align-items:center; justify-content:center; width:100%; flex:1; min-height:0; }
  canvas { image-rendering:pixelated; border:3px solid #000; box-shadow:0 0 30px #000; background:#000; }
  #ayuda { font-size:12px; opacity:.7; padding:6px; text-align:center; }

  /* Controles tactiles: solo se muestran en pantallas tactiles */
  #tactil { display:none; }
  @media (pointer: coarse) {
    #tactil { display:block; }

  #cruz { position:fixed; left:18px; bottom:calc(18px + env(safe-area-inset-bottom)); width:150px; height:150px; }
  .btn { position:absolute; background:rgba(255,255,255,.18); border:2px solid rgba(255,255,255,.55); border-radius:14px; display:flex; align-items:center; justify-content:center; color:#fff; font-size:22px; font-weight:bold; }
  .btn.on { background:rgba(255,255,255,.5); }
  #bArriba { left:50px; top:0;     width:50px; height:50px; }
  #bAbajo  { left:50px; top:100px; width:50px; height:50px; }
  #bIzq    { left:0;    top:50px;  width:50px; height:50px; }
  #bDer    { left:100px;top:50px;  width:50px; height:50px; }

  #bEspada { right:0;   bottom:0;   width:84px; height:84px; border-radius:50%; background:rgba(216,58,42,.35); border-color:rgba(255,160,140,.8); font-size:15px; }
  #bCorrer { right:92px; bottom:70px; width:68px; height:68px; border-radius:50%; background:rgba(58,95,208,.35); border-color:rgba(160,190,255,.8); font-size:12px; }

    <div class="btn" id="bAbajo"  data-k="arrowdown">▼</div>
  </div>

// ================= AJUSTE DE PANTALLA =================
// Escala el canvas en numeros enteros para que el pixel art se vea nitido
function ajustar(){
  const marco = document.getElementById('marco');
  const aw = marco.clientWidth - 8, ah = marco.clientHeight - 8;
  let k = Math.max(1, Math.floor(Math.min(aw / c.width, ah / c.height)));
  // si no cabe entero (celular chico), usar escala fraccionaria
  if (c.width * k > aw || c.height * k > ah) k = Math.min(aw / c.width, ah / c.height);
  c.style.width  = (c.width  * k) + 'px';
  c.style.height = (c.height * k) + 'px';
}
addEventListener('resize', ajustar);
addEventListener('orientationchange', () => setTimeout(ajustar, 150));
ajustar();

const PAL = {
  'K':'#1a1020','k':'#3a2a2a',
  'g':'#2f8f2f','G':'#58c04a','h':'#8be06a',
  's':'#f2c9a0','S':'#d9a073',
  'y':'#f5d84a','Y':'#c9a020',
  'b':'#3a5fd0','B':'#8fb0ff','n':'#1e2f7a',
  'r':'#d83a2a','R':'#ff7a5a','d':'#8f1f1a',
  'w':'#ffffff','e':'#cfe6f2','E':'#8fb0c8',
  'o':'#c8792a','O':'#8a4f1a',
  'p':'#b84a8a'
};
function crearSprite(filas, extra){
  const pal = extra ? {...PAL, ...extra} : PAL;
  const cv = document.createElement('canvas');
  cv.width = filas[0].length; cv.height = filas.length;
  const x = cv.getContext('2d');
  filas.forEach((f,j)=>[...f].forEach((ch,i)=>{
    if (pal[ch]) { x.fillStyle = pal[ch]; x.fillRect(i,j,1,1); }
  }));
  return cv;
}
function espejo(cv){
  const o = document.createElement('canvas'); o.width=cv.width; o.height=cv.height;
  const x = o.getContext('2d'); x.translate(cv.width,0); x.scale(-1,1); x.drawImage(cv,0,0); return o;
}

function rotar(cv, grados){
  const o = document.createElement('canvas');
  const sw = (grados===90||grados===270);
  o.width = sw?cv.height:cv.width; o.height = sw?cv.width:cv.height;
  const x = o.getContext('2d');
  x.translate(o.width/2,o.height/2); x.rotate(grados*Math.PI/180);
  x.drawImage(cv,-cv.width/2,-cv.height/2); return o;
}
const SPR_ESPADA = {
  arriba: SPR_ESPADA_V,
  abajo:  rotar(SPR_ESPADA_V,180),
  der:    rotar(SPR_ESPADA_V,90),
  izq:    rotar(SPR_ESPADA_V,270)

// ================= TERRENO PROCEDURAL =================
function rnd(seed){ let s=seed; return ()=>{ s=(s*1664525+1013904223)%4294967296; return s/4294967296; }; }
const fondo = document.createElement('canvas'); fondo.width=c.width; fondo.height=c.height;
(function(){
  const x = fondo.getContext('2d'); const r = rnd(7);
  x.fillStyle='#4c9a3a'; x.fillRect(0,0,c.width,c.height);
  for (let i=0;i<900;i++){
    const px=Math.floor(r()*c.width), py=Math.floor(r()*c.height);
    x.fillStyle = r()<0.5 ? '#5aad45' : '#3f8530';
    x.fillRect(px,py,1,2);
  }
  for (let i=0;i<60;i++){
    const px=Math.floor(r()*c.width), py=Math.floor(r()*c.height);
    x.fillStyle='#a8e87a'; x.fillRect(px,py,1,1); x.fillRect(px-1,py+1,3,1);
  }
  for (let i=0;i<14;i++){
    const px=Math.floor(r()*(c.width-4)), py=Math.floor(r()*(c.height-4));
    x.fillStyle='#fff3a0'; x.fillRect(px+1,py,2,2);
    x.fillStyle='#f5c020'; x.fillRect(px+1,py+1,1,1);
  }
  // Camino de tierra hacia el pueblo (borde derecho)
  x.fillStyle='#8a6a3a'; x.fillRect(196,81,60,26);
  x.fillStyle='#c8a46a'; x.fillRect(198,82,58,24);
  for (let i=0;i<70;i++){
    x.fillStyle = r()<0.5 ? '#b08850' : '#dcbc80';
    x.fillRect(198+Math.floor(r()*56), 83+Math.floor(r()*22), 2, 1);
  }
  // Letrero con flecha
  x.fillStyle='#1a1020'; x.fillRect(205,62,3,18); x.fillRect(196,58,22,10);
  x.fillStyle='#8a4f1a'; x.fillRect(206,63,1,17);
  x.fillStyle='#c8792a'; x.fillRect(197,59,20,8);
  x.fillStyle='#1a1020'; x.fillRect(200,62,10,2); x.fillRect(210,61,1,4); x.fillRect(211,62,1,2);
})();

function crearArbol(){
  const cv = document.createElement('canvas'); cv.width=32; cv.height=32;
  const x = cv.getContext('2d');
  const blob = (cx,cy,rx,ry,col)=>{ x.fillStyle=col; x.beginPath(); x.ellipse(cx,cy,rx,ry,0,0,7); x.fill(); };
  x.fillStyle='#1a1020'; x.fillRect(11,22,10,10);
  x.fillStyle='#8a4f1a'; x.fillRect(12,22,8,9);
  x.fillStyle='#c8792a'; x.fillRect(13,22,2,9);
  x.fillStyle='#5a3210'; x.fillRect(18,22,2,9);
  blob(16,13,15,13,'#0c2a14');
  blob(16,13,14,12,'#1f6b2a');
  blob(14,14,12,10,'#2f8f38');
  blob(12,10,9,7,'#4cc050');
  blob(10,8,5,4,'#8be06a');
  x.fillStyle='#1a5a24'; x.fillRect(6,20,20,2);
  x.fillStyle='#6fd45a'; [[8,12],[14,8],[20,11],[11,16],[18,16]].forEach(p=>x.fillRect(p[0],p[1],3,2));
  x.fillStyle='#1f6b2a'; [[22,16],[6,18],[16,19]].forEach(p=>x.fillRect(p[0],p[1],3,2));
  return cv;
}
const SPR_ARBOL = crearArbol();

function rand(a,b){ return Math.floor(Math.random()*(b-a+1))+a; }

            atacando:0, inv:0, rupias:0, paso:0 };
function lejosDelInicio(x,y){ return Math.hypot(x-p.x,y-p.y) > 40; }
// Zona libre junto al camino al pueblo, para que nada lo tape
const SALIDA = {x:c.width-64, y:54, w:64, h:70};
function libreSalida(x,y,s){ return !solapa({x,y,w:s,h:s}, SALIDA); }

for (let i=0;i<10;i++){ const x=rand(1,COLS-2)*T, y=rand(1,ROWS-2)*T; if(lejosDelInicio(x,y) && libreSalida(x,y,16)) arbustos.push({x,y,w:14,h:12,ox:1,oy:3}); }
for (let i=0;i<7;i++){ const x=rand(1,COLS-2)*T, y=rand(1,ROWS-2)*T; if(lejosDelInicio(x,y) && libreSalida(x,y,16)) rocas.push({x,y,w:14,h:12,ox:1,oy:3}); }

function crearCasa(techo, techoOsc, cura){
  const cv = document.createElement('canvas'); cv.width=48; cv.height=40;
  const x = cv.getContext('2d');
  // paredes
  x.fillStyle='#1a1020'; x.fillRect(4,16,40,24);
  x.fillStyle='#e8d8b0'; x.fillRect(5,17,38,22);
  x.fillStyle='#c8b48a'; x.fillRect(5,35,38,4);
  x.fillStyle='#8a4f1a'; x.fillRect(5,17,2,22); x.fillRect(41,17,2,22);
  // techo
  for (let j=0;j<18;j++){
    const m = Math.max(0,14-j);
    x.fillStyle='#1a1020'; x.fillRect(m,j,48-2*m,1);
    if (j>0 && j<17){ x.fillStyle = (j%4===0) ? techoOsc : techo; x.fillRect(m+1,j,46-2*m,1); }
  }
  x.fillStyle='rgba(255,255,255,.35)'; x.fillRect(14,1,20,1);
  // puerta
  x.fillStyle='#1a1020'; x.fillRect(19,26,10,14);
  x.fillStyle='#8a4f1a'; x.fillRect(20,27,8,13);
  x.fillStyle='#5a3210'; x.fillRect(23,27,2,13);
  x.fillStyle='#f5d84a'; x.fillRect(26,33,1,1);
  // ventanas
  [9,33].forEach(wx=>{
    x.fillStyle='#1a1020'; x.fillRect(wx-1,22,8,8);
    x.fillStyle='#8fd0f0'; x.fillRect(wx,23,6,6);
    x.fillStyle='#cfefff'; x.fillRect(wx,23,2,2);
    x.fillStyle='#8a4f1a'; x.fillRect(wx+3,23,1,6); x.fillRect(wx,26,6,1);
  });
  // letrero de curandero con corazon
  if (cura){
    x.fillStyle='#1a1020'; x.fillRect(16,17,16,8);
    x.fillStyle='#c8792a'; x.fillRect(17,18,14,6);
    x.fillStyle='#d83a2a';
    x.fillRect(21,19,2,1); x.fillRect(25,19,2,1);
    x.fillRect(21,20,6,1); x.fillRect(22,21,4,1); x.fillRect(23,22,2,1);
  }
  return cv;
}

// Panaderia "El Molinito"
function crearPanaderia(){
  const cv = document.createElement('canvas'); cv.width=64; cv.height=48;
  const x = cv.getContext('2d');
  // chimenea
  x.fillStyle='#1a1020'; x.fillRect(45,0,8,12);
  x.fillStyle='#a04a3a'; x.fillRect(46,1,6,11);
  // techo de tejas
  for (let j=2;j<20;j++){
    const m = Math.max(0, 19-j);
    x.fillStyle='#1a1020'; x.fillRect(m,j,64-2*m,1);
    if (j>2 && j<19){ x.fillStyle = (j%3===0) ? '#8a4f1a' : '#c8792a'; x.fillRect(m+1,j,62-2*m,1); }
  }
  // paredes
  x.fillStyle='#1a1020'; x.fillRect(4,19,56,29);
  x.fillStyle='#f0d8a8'; x.fillRect(5,20,54,27);
  x.fillStyle='#d8bc88'; x.fillRect(5,44,54,3);
  // letrero
  x.fillStyle='#1a1020'; x.fillRect(2,20,60,11);
  x.fillStyle='#5a3210'; x.fillRect(3,21,58,9);
  x.font='bold 8px monospace'; x.textAlign='center'; x.textBaseline='middle';
  x.fillStyle='#ffe8a0'; x.fillText('El Molinito', 32, 25.5, 56);
  // toldo a rayas
  for (let i=0;i<14;i++){ x.fillStyle = i%2 ? '#ffffff' : '#d83a2a'; x.fillRect(4+i*4,31,4,4); }
  x.fillStyle='#1a1020'; x.fillRect(4,35,56,1);
  // puerta
  x.fillStyle='#1a1020'; x.fillRect(26,36,12,12);
  x.fillStyle='#8a4f1a'; x.fillRect(27,37,10,11);
  x.fillStyle='#cfefff'; x.fillRect(29,38,6,4);
  x.fillStyle='#f5d84a'; x.fillRect(35,43,1,1);
  // vitrinas con pan
  [8,42].forEach(wx=>{
    x.fillStyle='#1a1020'; x.fillRect(wx-1,36,16,9);
    x.fillStyle='#cfe6f2'; x.fillRect(wx,37,14,7);
    x.fillStyle='#8a4f1a'; x.fillRect(wx,42,14,2);
    x.fillStyle='#c8792a'; x.fillRect(wx+1,40,5,2); x.fillRect(wx+8,39,5,3);
    x.fillStyle='#f5c070'; x.fillRect(wx+2,40,2,1); x.fillRect(wx+9,39,3,1);
  });
  return cv;
}

function crearFondoPueblo(){
  const cv = document.createElement('canvas'); cv.width=c.width; cv.height=c.height;
  const x = cv.getContext('2d'); const r = rnd(21);
  x.fillStyle='#4c9a3a'; x.fillRect(0,0,c.width,c.height);
  for (let i=0;i<700;i++){
    x.fillStyle = r()<0.5 ? '#5aad45' : '#3f8530';
    x.fillRect(Math.floor(r()*c.width), Math.floor(r()*c.height), 1, 2);
  }
  // empedrado
  const empedrar = (rx,ry,rw,rh)=>{
    x.fillStyle='#7a6a52'; x.fillRect(rx,ry,rw,rh);
    for (let yy=ry; yy<ry+rh; yy+=4){
      const off = ((yy-ry)/4)%2 ? 3 : 0;
      for (let xx=rx-off; xx<rx+rw; xx+=6){
        const x0=Math.max(xx+1,rx), x1=Math.min(xx+6,rx+rw);
        if (x1<=x0) continue;
        x.fillStyle = r()<0.5 ? '#c2b296' : '#b0a084';
        x.fillRect(x0, yy+1, x1-x0, Math.min(3, ry+rh-yy-1));
      }
    }
  };
  empedrar(8,62,240,122);
  empedrar(0,78,8,36);
  // jardin con flores
  x.fillStyle='#2f6f28'; x.fillRect(84,146,88,32);
  x.fillStyle='#4c9a3a'; x.fillRect(85,147,86,30);
  const flores = ['#ff7a9a','#fff3a0','#b8a0ff','#ffffff'];
  for (let i=0;i<22;i++){
    const px=87+Math.floor(r()*80), py=149+Math.floor(r()*25);
    x.fillStyle=flores[Math.floor(r()*flores.length)]; x.fillRect(px,py,2,2);
    x.fillStyle='#f5c020'; x.fillRect(px,py,1,1);
  }
  return cv;
}

// ================= ENTRADA: TECLADO =================
const keys = {};
addEventListener('keydown', e => { keys[e.key.toLowerCase()] = true; if ([' ','arrowup','arrowdown','arrowleft','arrowright'].includes(e.key.toLowerCase())) e.preventDefault(); });
addEventListener('keyup',   e => { keys[e.key.toLowerCase()] = false; });

// ================= ENTRADA: TACTIL =================
// Cada boton usa pointer events, asi funcionan varios dedos a la vez
// (por ejemplo moverte con el pulgar izquierdo y atacar con el derecho)
document.querySelectorAll('.btn').forEach(b => {
  const k = b.dataset.k;
  const activar = e => { e.preventDefault(); keys[k] = true;  b.classList.add('on'); b.setPointerCapture && b.setPointerCapture(e.pointerId); };
  const soltar  = e => { e.preventDefault(); keys[k] = false; b.classList.remove('on'); };
  b.addEventListener('pointerdown', activar);
  b.addEventListener('pointerup', soltar);
  b.addEventListener('pointercancel', soltar);
  b.addEventListener('lostpointercapture', soltar);
  b.addEventListener('contextmenu', e => e.preventDefault());
});
// Tocar la pantalla cuando termina el juego reinicia
c.addEventListener('pointerdown', () => { if (fin) location.reload(); });

let escena = 'campo';   // 'campo' o 'pueblo'
function choca(x,y,w,h,ignorar){
  if (x<0||y<0||x+w>c.width||y+h>c.height) return true;
  const lista = escena==='pueblo' ? pueblo.solidos : solidos;
  return lista.some(s => s!==ignorar && x < s.x+s.ox+s.w && x+w > s.x+s.ox && y < s.y+s.oy+s.h && y+h > s.y+s.oy);
}
function solapa(a,b){ return a.x<b.x+b.w && a.x+a.w>b.x && a.y<b.y+b.h && a.y+a.h>b.y; }

// ================= ENEMIGOS =================
const DIRS = [[0,-1,'arriba'],[0,1,'abajo'],[-1,0,'izq'],[1,0,'der']];
const enemigos=[], balas=[], drops=[], particulas=[];
for (let i=0;i<5;i++){
  let ex,ey,n=0;
  do { ex=rand(1,COLS-2)*T; ey=rand(1,ROWS-2)*T; n++; } while ((choca(ex,ey,12,12) || Math.hypot(ex-p.x,ey-p.y)<70) && n<200);
  enemigos.push({x:ex,y:ey,w:12,h:12,vida:2,dir:rand(0,3),t:rand(30,90),disp:rand(80,200),golpe:0});
}

function espadaRect(){
  if (p.dir==='arriba') return {x:p.x-1, y:p.y-12, w:6,  h:12};
  if (p.dir==='abajo')  return {x:p.x+5, y:p.y+p.h-1, w:6, h:12};
  if (p.dir==='izq')    return {x:p.x-12,y:p.y+3,  w:12, h:6};
  return                       {x:p.x+p.w-1,y:p.y+3, w:12, h:6};
}
function chispas(x,y,col){ for(let i=0;i<8;i++) particulas.push({x,y,dx:(Math.random()-.5)*2,dy:(Math.random()-.5)*2,vida:20,col}); }

let fin = false;
function dano(){ p.vida--; p.inv=70; chispas(p.x+5,p.y+5,'#ff5050'); if (p.vida<=0) fin='perdiste'; }

// ================= ESCENAS, ALDEANOS Y DIALOGOS =================
let dialogo = null, cartel = null, fundido = 0;
let espAntes = false, esperarSoltar = false;
const CAMINO_Y1 = 72, CAMINO_Y2 = 116;   // franja del camino entre campo y pueblo

function enCamino(){ return p.y >= CAMINO_Y1 && p.y + p.h <= CAMINO_Y2; }
function entrar(dest){
  escena = dest; balas.length = 0; particulas.length = 0; fundido = 14; p.atacando = 0;
  p.y = Math.min(Math.max(p.y, CAMINO_Y1+2), CAMINO_Y2-p.h-2);
  if (dest==='pueblo'){ p.x = 3; cartel = {texto:'Lagos', t:150}; }
  else p.x = c.width - p.w - 3;
}
function revisarSalida(dx){
  if (escena==='campo' && dx>0 && p.x+p.w >= c.width-2 && enCamino()) entrar('pueblo');
  else if (escena==='pueblo' && dx<0 && p.x <= 2 && enCamino()) entrar('campo');
}
function npcCercano(){
  let mejor=null, dMin=20;
  pueblo.npcs.forEach(n=>{ const d=Math.hypot(n.x-p.x, n.y-p.y); if (d<dMin){ dMin=d; mejor=n; } });
  return mejor;
}
function hablar(n){
  const lineas = typeof n.frases==='function' ? n.frases() : n.frases;
  dialogo = {nombre:n.nombre, lineas, i:0};
}
function actualizarNPCs(){
  pueblo.npcs.forEach(n=>{
    if (!n.anda) return;
    n.t--;
    if (n.t<=0){ n.dir = Math.random()<0.4 ? -1 : rand(0,3); n.t = rand(40,110); }
    if (n.dir<0) return;
    const d = DIRS[n.dir], nx = n.x+d[0]*n.vel, ny = n.y+d[1]*n.vel;
    if (Math.hypot(nx-n.cx, ny-n.cy) > n.radio || choca(nx,ny,n.w,n.h,n) || solapa({x:nx,y:ny,w:n.w,h:n.h}, p)) n.t = 0;
    else { n.x = nx; n.y = ny; n.paso += 0.12; }
  });
}
function actualizarParticulas(){
  for (let i=particulas.length-1;i>=0;i--){
    const q=particulas[i]; q.x+=q.dx; q.y+=q.dy; q.vida--; if(q.vida<=0) particulas.splice(i,1);
  }
}

// ================= ACTUALIZAR =================
function actualizar(){
  if (fin){ if (keys['enter']) location.reload(); return; }

  // Espacio "recien presionado" (para hablar y pasar dialogos)
  const espNuevo = !!keys[' '] && !espAntes;
  espAntes = !!keys[' '];
  if (!keys[' ']) esperarSoltar = false;
  if (fundido>0) fundido--;
  if (cartel && --cartel.t<=0) cartel = null;
  actualizarParticulas();

  if (dialogo){
    if (espNuevo && ++dialogo.i >= dialogo.lineas.length){ dialogo = null; esperarSoltar = true; }
    return;
  }

  let dx=0, dy=0;
  if (keys['arrowleft'] ||keys['a']) { dx=-1; p.dir='izq'; }
  if (keys['arrowright']||keys['d']) { dx=1;  p.dir='der'; }
  if (keys['arrowup']   ||keys['w']) { dy=-1; p.dir='arriba'; }
  if (keys['arrowdown'] ||keys['s']) { dy=1;  p.dir='abajo'; }
  if (dx&&dy){ dx*=0.7; dy*=0.7; }
  let v = p.vel;
  const corre = keys['shift'] && p.est>0 && (dx||dy);
  if (corre){ v*=1.7; p.est-=1.2; } else p.est=Math.min(100,p.est+0.6);
  if (p.atacando>0) v*=0.3;
  if (!choca(p.x+dx*v,p.y,p.w,p.h)) p.x+=dx*v;
  if (!choca(p.x,p.y+dy*v,p.w,p.h)) p.y+=dy*v;
  if (dx||dy) p.paso+=corre?0.3:0.18;
  revisarSalida(dx);

  if (escena==='pueblo'){
    actualizarNPCs();
    if (espNuevo){ const n = npcCercano(); if (n){ hablar(n); return; } }
  }

  if (keys[' '] && !esperarSoltar && p.atacando===0 && p.est>=10){ p.atacando=16; p.est-=10; }
  if (p.atacando>0){
    p.atacando--;
    if (escena==='campo'){
    const e = espadaRect();
    enemigos.forEach(en=>{
      if (en.golpe>0) return;
      if (solapa(e,en)){
        en.vida--; en.golpe=20; chispas(en.x+6,en.y+6,'#ffffff');
        const d = DIRS.find(d=>d[2]===p.dir); en.x+=d[0]*8; en.y+=d[1]*8;
      }
    });
    }
  }
  if (p.inv>0) p.inv--;
  if (escena!=='campo') return;   // en el pueblo no hay enemigos

  for (let i=enemigos.length-1;i>=0;i--){
    const en = enemigos[i];
    if (en.golpe>0) en.golpe--;
    if (en.vida<=0){
      chispas(en.x+6,en.y+6,'#ffd84a');
      drops.push({x:en.x+2,y:en.y+2,tipo:Math.random()<0.35?'corazon':'rupia'});
      enemigos.splice(i,1); continue;
    }
    en.t--; en.disp--;
    if (en.t<=0){ en.dir=rand(0,3); en.t=rand(30,90); }
    const d = DIRS[en.dir];
    const nx=en.x+d[0]*0.4, ny=en.y+d[1]*0.4;
    if (!choca(nx,ny,en.w,en.h)){ en.x=nx; en.y=ny; } else en.t=0;
    if (en.disp<=0){
      en.disp=rand(100,220);
      balas.push({x:en.x+4,y:en.y+4,w:4,h:4,dx:d[0]*1.6,dy:d[1]*1.6});
    }
    if (p.inv===0 && solapa(p,en)) dano();
  }

  for (let i=balas.length-1;i>=0;i--){
    const b=balas[i]; b.x+=b.dx; b.y+=b.dy;
    if (choca(b.x,b.y,b.w,b.h)){ balas.splice(i,1); continue; }
    if (p.inv===0 && solapa(p,b)){ dano(); balas.splice(i,1); }
  }

  for (let i=drops.length-1;i>=0;i--){
    if (solapa(p,{x:drops[i].x,y:drops[i].y,w:10,h:10})){
      if (drops[i].tipo==='corazon') p.vida=Math.min(p.vidaMax,p.vida+1); else p.rupias++;
      drops.splice(i,1);
    }
  }
  if (enemigos.length===0) fin='ganaste';
}

// ================= DIBUJO =================
function sombra(x,y,w){ ctx.fillStyle='rgba(0,30,0,.35)'; ctx.fillRect(Math.floor(x),Math.floor(y),w,2); }

function dibujarLink(){
  if (p.inv>0 && Math.floor(p.inv/4)%2) return;
  const bob = (Math.floor(p.paso)%2===1) ? -1 : 0;
  sombra(p.x-1,p.y+11,12);
  ctx.drawImage(SPR_LINK[p.dir], Math.floor(p.x-3), Math.floor(p.y-5+bob));
  if (p.atacando>0){
    const e=espadaRect(); const s=SPR_ESPADA[p.dir];
    let sx=e.x, sy=e.y;
    if (p.dir==='arriba'){ sx=p.x+2; sy=p.y-11; }
    if (p.dir==='abajo') { sx=p.x+2; sy=p.y+9; }
    if (p.dir==='izq')   { sx=p.x-11; sy=p.y+2; }
    if (p.dir==='der')   { sx=p.x+9;  sy=p.y+2; }
    ctx.drawImage(s, Math.floor(sx), Math.floor(sy));
    ctx.strokeStyle='rgba(255,255,255,.6)'; ctx.lineWidth=1;
    ctx.strokeRect(e.x+.5,e.y+.5,e.w-1,e.h-1);
  }
}
function dibujarOctorok(en){
  ctx.globalAlpha = (en.golpe>0 && Math.floor(en.golpe/3)%2) ? 0.35 : 1;
  sombra(en.x,en.y+12,12);
  ctx.drawImage(SPR_OCTO, Math.floor(en.x-2), Math.floor(en.y-3));
  ctx.globalAlpha=1;
}
function dibujarHUD(){
  ctx.fillStyle='#000'; ctx.fillRect(3,3,20,20);
  ctx.strokeStyle='#d8d8e0'; ctx.strokeRect(3.5,3.5,19,19);
  ctx.drawImage(SPR_ESPADA.arriba, 10, 6);
  for (let i=0;i<p.vidaMax;i++){
    const cx=150+(i%6)*15, cy=4;
    if (i<p.vida) ctx.drawImage(SPR_CORAZON,cx,cy);
    else { ctx.fillStyle='#14101c'; ctx.fillRect(cx+1,cy+1,10,8); }
  }
  ctx.fillStyle='#000'; ctx.fillRect(27,5,52,7);
  ctx.fillStyle='#1a2a4a'; ctx.fillRect(28,6,50,5);
  ctx.fillStyle='#5ab8ff'; ctx.fillRect(28,6,Math.max(0,p.est*0.5),5);
  ctx.fillStyle='#bfe6ff'; ctx.fillRect(28,6,Math.max(0,p.est*0.5),1);
  ctx.drawImage(SPR_RUPIA,27,15);
  ctx.fillStyle='#fff'; ctx.font='8px monospace'; ctx.fillText('x'+p.rupias,37,22);
}

function dibujarPueblo(){
  ctx.drawImage(pueblo.fondo,0,0);
  const cosas = [];
  pueblo.casas.forEach(o=>cosas.push({y:o.y+o.spr.height,f:()=>{
    sombra(o.x+4, o.y+o.spr.height-2, o.spr.width-8); ctx.drawImage(o.spr,o.x,o.y);
    if (o.humo){   // humito saliendo de la chimenea del horno
      const t = Date.now()/120;
      for (let i=0;i<3;i++){
        const k = (t+i*6)%18;
        ctx.fillStyle = 'rgba(230,230,240,'+(1-k/18)+')';
        ctx.fillRect(Math.floor(o.x+48+Math.sin(k/3+i)*2), Math.floor(o.y-1-k), 3, 3);
      }
    }
  }}));
  pueblo.letreros.forEach(o=>cosas.push({y:o.y+26,f:()=>{ sombra(o.x+14,o.y+25,12); ctx.drawImage(o.spr,o.x,o.y); }}));
  const fu = pueblo.fuente;
  cosas.push({y:fu.y+30,f:()=>{
    ctx.drawImage(fu.spr,fu.x,fu.y);
    // gotas cayendo de la fuente
    const t = Date.now()/90;
    ctx.fillStyle='#cfefff';
    for (let i=0;i<4;i++){
      const k = (t+i*2.5)%10, lado = i%2 ? 1 : -1;
      ctx.fillRect(Math.floor(fu.x+16+lado*(3+k*0.6)), Math.floor(fu.y+8+k*1.2), 1, 1);
    }
  }});
  pueblo.arbustos.forEach(o=>cosas.push({y:o.y+16,f:()=>{ sombra(o.x+1,o.y+13,14); ctx.drawImage(SPR_ARBUSTO,o.x,o.y); }}));
  pueblo.npcs.forEach(n=>cosas.push({y:n.y+10,f:()=>{
    const bob = (Math.floor(n.paso)%2===1) ? -1 : 0;
    sombra(n.x-1,n.y+11,12);
    ctx.drawImage(n.spr, Math.floor(n.x-3), Math.floor(n.y-5+bob));
  }}));
  cosas.push({y:p.y+10,f:dibujarLink});
  cosas.sort((a,b)=>a.y-b.y).forEach(o=>o.f());

  // Globito "!" sobre el aldeano con el que puedes hablar
  const n = !dialogo && npcCercano();
  if (n){
    const bx=Math.floor(n.x+1), by=Math.floor(n.y-16+Math.sin(Date.now()/200));
    ctx.fillStyle='#1a1020'; ctx.fillRect(bx-1,by-1,10,10);
    ctx.fillStyle='#fff'; ctx.fillRect(bx,by,8,8);
    ctx.fillStyle='#1a1020'; ctx.fillRect(bx+3,by+1,2,4); ctx.fillRect(bx+3,by+6,2,1);
  }
}

function partirTexto(txt, ancho){
  const palabras = txt.split(' '), lineas = []; let actual = '';
  palabras.forEach(w=>{
    const prueba = actual ? actual+' '+w : w;
    if (ctx.measureText(prueba).width > ancho && actual){ lineas.push(actual); actual = w; }
    else actual = prueba;
  });
  if (actual) lineas.push(actual);
  return lineas;
}
function dibujarDialogo(){
  const bx=6, by=c.height-50, bw=c.width-12, bh=44;
  ctx.fillStyle='rgba(10,8,20,.92)'; ctx.fillRect(bx,by,bw,bh);
  ctx.strokeStyle='#fff'; ctx.lineWidth=1; ctx.strokeRect(bx+.5,by+.5,bw-1,bh-1);
  ctx.font='8px monospace';
  ctx.fillStyle='#f5d84a'; ctx.fillText(dialogo.nombre, bx+6, by+11);
  ctx.fillStyle='#fff';
  partirTexto(dialogo.lineas[dialogo.i], bw-14).slice(0,3).forEach((l,i)=>ctx.fillText(l, bx+6, by+22+i*9));
  if (Math.floor(Date.now()/300)%2){ ctx.fillStyle='#f5d84a'; ctx.fillRect(bx+bw-11,by+bh-8,5,2); ctx.fillRect(bx+bw-10,by+bh-6,3,1); }
}
function dibujarCartel(){
  ctx.globalAlpha = Math.min(1, cartel.t/30);
  ctx.font='bold 10px monospace'; ctx.textAlign='center';
  const w = ctx.measureText(cartel.texto).width + 16;
  ctx.fillStyle='rgba(10,8,20,.85)'; ctx.fillRect(c.width/2-w/2, 30, w, 16);
  ctx.strokeStyle='#f5d84a'; ctx.strokeRect(c.width/2-w/2+.5, 30.5, w-1, 15);
  ctx.fillStyle='#fff'; ctx.fillText(cartel.texto, c.width/2, 41);
  ctx.textAlign='left'; ctx.globalAlpha=1;
}

function dibujarCampo(){
  ctx.drawImage(fondo,0,0);
  const cosas = [];
  rocas.forEach(o=>cosas.push({y:o.y+16,f:()=>ctx.drawImage(SPR_ROCA,o.x,o.y)}));
  arbustos.forEach(o=>cosas.push({y:o.y+16,f:()=>{ sombra(o.x+1,o.y+13,14); ctx.drawImage(SPR_ARBUSTO,o.x,o.y); }}));
  arboles.forEach(o=>cosas.push({y:o.y+32,f:()=>{ sombra(o.x+2,o.y+30,28); ctx.drawImage(SPR_ARBOL,o.x,o.y); }}));
  drops.forEach(d=>cosas.push({y:d.y,f:()=>{
    const flota=Math.sin(Date.now()/150+d.x)*1;
    ctx.drawImage(d.tipo==='corazon'?SPR_CORAZON:SPR_RUPIA, d.x, d.y+flota);
  }}));
  enemigos.forEach(e=>cosas.push({y:e.y+12,f:()=>dibujarOctorok(e)}));
  cosas.push({y:p.y+10,f:dibujarLink});
  balas.forEach(b=>cosas.push({y:b.y,f:()=>{ ctx.fillStyle='#1a1020'; ctx.fillRect(b.x-1,b.y-1,6,6); ctx.fillStyle='#c8792a'; ctx.fillRect(b.x,b.y,4,4); ctx.fillStyle='#ffd08a'; ctx.fillRect(b.x,b.y,2,2); }}));
  cosas.sort((a,b)=>a.y-b.y).forEach(o=>o.f());
}

function dibujar(){
  if (escena==='pueblo') dibujarPueblo(); else dibujarCampo();

  particulas.forEach(q=>{ ctx.fillStyle=q.col; ctx.globalAlpha=q.vida/20; ctx.fillRect(q.x,q.y,2,2); });
  ctx.globalAlpha=1;
  dibujarHUD();
  if (cartel) dibujarCartel();
  if (dialogo) dibujarDialogo();
  if (fundido>0){ ctx.fillStyle='rgba(0,0,0,'+(fundido/14)+')'; ctx.fillRect(0,0,c.width,c.height); }

  if (fin){
    ctx.fillStyle='rgba(10,8,20,.75)'; ctx.fillRect(0,0,c.width,c.height);
    ctx.fillStyle='#fff'; ctx.textAlign='center';
    ctx.font='bold 16px monospace';
    ctx.fillText(fin==='ganaste'?'¡Ganaste!':'Game Over', c.width/2, c.height/2-4);
    ctx.font='8px monospace'; ctx.fillText('Enter o toca la pantalla para reiniciar', c.width/2, c.height/2+14);
    ctx.textAlign='left';
  }
}

function loop(){ actualizar(); dibujar(); requestAnimationFrame(loop); }
loop();
</script>
